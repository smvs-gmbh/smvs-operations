<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{subject}}</title></head>
<body style="margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#20374e">
<div style="max-width:640px;margin:24px auto;background:#fff;padding:28px;border:1px solid #dbe4ee;border-radius:10px">
<p style="font-size:22px;font-weight:bold">SMVS Alert Desk</p>
<p style="padding:10px;background:#fff3cd;color:#684e00"><strong>TEST — Synthetic cases</strong></p>
<h1 style="font-size:22px">{{heading}}</h1>
<pre style="font-family:Arial,sans-serif;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere">{{message}}</pre>
{{#each links}}<p><a href="{{url}}" style="display:inline-block;padding:12px 18px;color:#fff;background:#225f8c;text-decoration:none;border-radius:6px">{{label}}</a></p>{{/each}}
<p style="font-size:13px;color:#61748a">This message relates to the SMVS TEST environment. Invitations and verification codes are personal; do not forward them.</p>
</div></body></html>
