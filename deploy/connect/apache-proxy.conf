# Dedicated public Connect node; only the NGINX node can use this proxy.
ServerRoot "/var/www/webroot/"
DocumentRoot "/var/www/webroot/"
User apache
Group apache
DefaultRuntimeDir "/var/run"
ServerName connect.smvs-gmbh.ch
Protocols h2 h2c http/1.1
ErrorLog "/var/log/httpd/error_log"
CustomLog /dev/null combined
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 20
LimitRequestBody 131072
Header unset Upgrade
<Directory "/var/www/webroot/">
    AllowOverride None
    Options -Indexes
    Require all denied
</Directory>
# Preserve the existing HTTP ACME challenge directory, if used by the add-on.
Alias /.well-known /var/www/webroot/ROOT/.well-known
<Directory "/var/www/webroot/ROOT/.well-known">
    AllowOverride None
    Options -Indexes
    Require ip 10.100.37.96 127.0.0.1 ::1
</Directory>
<Location "/">
    Require ip 10.100.37.96 127.0.0.1 ::1
</Location>
ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:8013/
ProxyPassReverse / http://127.0.0.1:8013/
