limit_req_zone $binary_remote_addr zone=connect_webhooks:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=connect_confirm:10m rate=10r/m;

server {
    listen 443 quic reuseport;
    listen 443 ssl;
    listen [::]:443 quic reuseport;
    listen [::]:443 ssl;
    http2 on;
    server_name connect.smvs-gmbh.ch;
    if ($host != connect.smvs-gmbh.ch) { return 421; }
    # Do not inherit trust in forwarded IP headers from arbitrary private nodes.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    ssl_certificate /var/lib/jelastic/SSL/jelastic.chain;
    ssl_certificate_key /var/lib/jelastic/SSL/jelastic.key;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log off;
    error_log /var/log/nginx/localhost.error_log warn;
    client_max_body_size 128k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    limit_req_status 429;
    location = / { include conf.d/connect-proxy.inc; }
    location = /confirm {
        limit_req zone=connect_confirm burst=10 nodelay;
        include conf.d/connect-proxy.inc;
    }
    location = /webhooks/tally/registrations {
        limit_req zone=connect_webhooks burst=10 nodelay;
        include conf.d/connect-proxy.inc;
    }
    location = /assets/confirmation.js { include conf.d/connect-proxy.inc; }
    location = /assets/confirmation.css { include conf.d/connect-proxy.inc; }
    location / { return 404; }
}
