[unix_http_server]
file=%(here)s/run/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=%(here)s/run/supervisord.pid
childlogdir=%(here)s/logs
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/run/supervisor.sock

[program:connect]
directory=%(here)s
command=%(here)s/.venv/bin/uvicorn app.connect.gateway:from_environment --factory --host 127.0.0.1 --port 8013 --no-access-log --no-proxy-headers
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/connect.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
