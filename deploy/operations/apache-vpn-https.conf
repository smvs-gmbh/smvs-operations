# SMVS Operations: private HTTPS with narrowly observed VPN source.
<IfModule ssl_module>
Listen 10.100.32.195:443
<VirtualHost 10.100.32.195:443>
    ServerName operations.smvs-gmbh.ch
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLSessionTickets off
    SSLCertificateFile /var/lib/jelastic/vcs/smvs-operations-current/acme/config/live/operations.smvs-gmbh.ch/fullchain.pem
    SSLCertificateKeyFile /var/lib/jelastic/vcs/smvs-operations-current/acme/config/live/operations.smvs-gmbh.ch/privkey.pem
    ErrorLog /var/log/httpd/ssl-error.log
    CustomLog /dev/null combined
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    LimitRequestBody 10485760
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^operations\.smvs-gmbh\.ch(?::443)?$ [NC]
    RewriteRule ^ - [R=403,L]
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    <Location "/">
        # VPN access observed from the Mac on 2026-11-09; no broad RFC1918 ranges.
        Require ip 127.0.0.1 ::1 10.100.32.195 10.101.15.115
    </Location>
    ProxyPass / http://127.0.0.1:8015/
    ProxyPassReverse / http://127.0.0.1:8015/
</VirtualHost>
</IfModule>
