[unix_http_server]
file=%(here)s/run/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=%(here)s/run/supervisord.pid
childlogdir=%(here)s/logs
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/run/supervisor.sock

[program:operations-portal]
directory=%(here)s
command=%(here)s/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8012 --no-access-log --no-proxy-headers
autostart=false
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/portal.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:registration-api]
directory=%(here)s
command=%(here)s/.venv/bin/uvicorn app.registration.internal_gateway:from_environment --factory --host 10.100.32.195 --port 8443 --no-access-log --no-proxy-headers --ssl-certfile %(here)s/certs/registration-api.pem --ssl-keyfile %(here)s/certs/registration-api.key
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/registration-api.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:registration-cleanup]
directory=%(here)s
command=%(here)s/.venv/bin/python -m app.registration.internal_worker --watch --purge-only
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/registration-cleanup.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:registration-mail]
directory=%(here)s
command=%(here)s/.venv/bin/python -m app.registration.internal_worker --watch
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/registration-mail.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:operations-scheduler]
directory=%(here)s
command=%(here)s/.venv/bin/python -m app.integration.scheduler --serve
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:operations-portal-https]
directory=%(here)s
command=%(here)s/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8015 --no-access-log --proxy-headers --forwarded-allow-ips 127.0.0.1
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/portal-https.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

environment=PORTAL_AUTH_ORIGIN="https://operations.smvs-gmbh.ch"
